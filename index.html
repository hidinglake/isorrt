<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>isoRRT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* layout: name and timer at the top left, accuracy at the top right, the terms with Clear and Check under them beside a large board, the statements in a row beneath; the only colour on the page belongs to the three terms */
:root {
  --paper: #000000; --paper-raised: #121212; --ink: #f2f2f2; --ink-soft: #9a9a9a;
  --grid: #4a4a4a; --grid-faint: #1e1e1e; --north: #ff6a4d; --pick: #ffffff;
  /* right and wrong are shown in white, by ticks, crosses and line style, so they never look like a term colour */
  --ok: #f2f2f2; --bad: #f2f2f2;
  /* the three term colours, at full saturation: red, green, yellow (also told apart by lightness) */
  --term-0: #ff2a2a; --term-1: #19e64b; --term-2: #ffe500; --on-term: #000000;
  --right: #19e64b; --wrong: #ff2a2a;   /* the ✓ and ✕ beside each statement once an answer is checked */
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  /* sizes on a large screen grow with the window's height, so a tall monitor is filled rather than left empty */
  --gap: clamp(14px, 1.9vh, 28px);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---- desktop: title and accuracy across the top; the terms in a column beside a large board; the three
   statements side by side under it; the timer and the Clear / Check buttons along the bottom ---- */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); padding: 14px clamp(24px, 2vw, 48px) 16px; }
.top { flex: none; display: flex; align-items: center; gap: 24px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink); }
.name { flex: none; font-family: var(--font-display); font-weight: 700; font-size: clamp(102px, 11vh, 150px); letter-spacing: .03em; line-height: .9; }
.mid { flex: 1; min-height: 0; display: flex; gap: clamp(28px, 3vw, 64px); }
.brief { flex: none; }
.note { display: none; }

.lines { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.lines li { display: grid; grid-template-columns: minmax(0, 1fr) 1.1em; gap: 10px; align-items: center; padding: clamp(10px, 1.2vh, 18px) clamp(16px, 1.2vw, 26px); background: var(--paper-raised); border: 1.5px solid var(--grid); font-family: var(--font-mono); font-size: clamp(26px, 3.6vh, 50px); line-height: 1.25; }
/* after a check each statement keeps its plain box and gets the tool's own ✓ (green) or ✕ (red) at its right */
.lines .mark { display: grid; place-items: center; }
.lines .mark svg { width: 100%; height: auto; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.lines li.ok .mark { color: var(--right); }
.lines li.off .mark { color: var(--wrong); }
/* a term carries its colour everywhere: its name in the statements, its button, its tile on the board */
.h0 { --c: var(--term-0); } .h1 { --c: var(--term-1); } .h2 { --c: var(--term-2); }
.lines li > span:first-child { color: var(--ink); }
.t { color: var(--c); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
.rel { font-weight: 400; }
.verdict { flex: 1; min-width: 0; align-self: center; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 3vh, 40px); letter-spacing: .08em; text-transform: uppercase; line-height: 1.1; }
.verdict.ok { color: var(--ok); } .verdict.off { color: var(--bad); }

/* ---- terms: a column of large square buttons; the chosen one has its ▲ ▼ attached to its right side ---- */
/* the terms column fills the height from the timer to the statements: three squares, then Clear and Check, evenly spaced */
.tray { flex: none; width: clamp(210px, 26vh, 400px); display: flex; flex-direction: column; gap: var(--gap); }
.chips { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.term { flex: 1 1 0; min-height: 58px; display: grid; grid-template-columns: minmax(0, 1fr) clamp(48px, 5vh, 72px); grid-template-rows: 1fr 1fr; grid-template-areas: "pick up" "pick down"; }
.term button { color: inherit; }
.term button:disabled { cursor: default; }
.term .pick { grid-area: pick; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 2px solid var(--c); background: var(--c); color: var(--on-term); font-family: var(--font-mono); }
.term.down .pick { background: transparent; color: var(--c); border-style: dashed; }
/* the chosen term: no extra outline; a placed one's dashed border turns solid, and its arrows take its colour */
.term.sel .pick { border-style: solid; }
.term .pick:hover:not(:disabled) { filter: brightness(1.15); }
.term .who { font-weight: 700; font-size: clamp(34px, 6.4vh, 96px); letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.term .tier { display: none; font-size: 13px; opacity: .85; white-space: nowrap; }
.term .nudge { display: grid; place-items: center; font-size: clamp(15px, 2vh, 28px); line-height: 1; color: var(--c); border: 2px solid var(--c); border-left: none; visibility: hidden; }
.term .nudge[data-push="1"] { grid-area: up; }
.term .nudge[data-push="-1"] { grid-area: down; border-top-width: 1px; }
.term.sel .nudge { visibility: visible; }
.term .nudge:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 22%, transparent); }
.term .nudge:disabled { opacity: .3; }
.term button:focus-visible { outline-offset: -4px; }

/* Clear and Check sit under the term squares, exactly as wide as them, one above the other */
.acts { flex: none; display: flex; gap: var(--gap); width: calc(100% - clamp(48px, 5vh, 72px)); }
.acts .act { aspect-ratio: 1; min-height: 0; padding: 0; display: grid; place-items: center; }
.acts .act svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.act { flex: 1; min-height: clamp(44px, 6.5vh, 92px); padding: 10px 14px; border: 1.5px solid var(--ink); font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 2.6vh, 34px); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.act:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.act.main { background: var(--ink); color: var(--paper); }
.act.main:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 82%, var(--paper)); }
.act:disabled { opacity: .35; cursor: default; }

/* ---- board ---- */
.desk { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.sheet { flex: 1; min-height: 0; display: grid; place-items: center; padding: 0; overflow: hidden; }
.sheet svg { display: block; width: 100%; height: 100%; touch-action: manipulation; user-select: none; }
.cell { fill: var(--paper-raised); stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; cursor: pointer; }
/* the board is a thick white-edged slab: its two near sides show which way is down, so an upside-down board is plain to see */
.slab { pointer-events: none; stroke: var(--ink); stroke-width: 3.5; stroke-linejoin: round; }
.slab.a { fill: #d9d9d9; } .slab.b { fill: #a6a6a6; }
.cell:hover { fill: color-mix(in srgb, var(--pick) 20%, var(--paper-raised)); }
#compass { pointer-events: none; }
/* the compass point: one plain letter in the page's own white lettering, with a dark edge so it reads over a tile too */
.given text, .rose { font-family: var(--font-display); paint-order: stroke; stroke-linejoin: round; }
/* the compass letter: plain white, no outline */
.given text { fill: var(--ink); stroke: none; font-weight: 700; font-size: 40px; letter-spacing: .04em; }
.rose { stroke: var(--paper); stroke-width: 5px; }
/* the compass letters bob gently in and out from the board */
.bob { animation: bob 1.6s ease-in-out infinite alternate; }
.lead { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.lead.faint { stroke: var(--ink-soft); stroke-width: 1.2; }
@keyframes bob { from { transform: translate(0, 0); } to { transform: translate(var(--bx), var(--by)); } }
.rose { fill: var(--ink-soft); font-weight: 600; font-size: 26px; }
/* terms are thin tiles the shape of their square, in the term's colour and with no name on them; nothing
   drawn on the board takes clicks except the squares, so a term can only be chosen in the list */
.tile, .slot { pointer-events: none; }
.tile .face { fill: var(--c); stroke: color-mix(in srgb, var(--c) 50%, #000); stroke-width: 1.5; stroke-linejoin: round; }
.tile .side.a { fill: color-mix(in srgb, var(--c) 62%, #000); }
.tile .side.b { fill: color-mix(in srgb, var(--c) 42%, #000); }
.tile.sel .face { stroke: var(--pick); stroke-width: 5; }
.tile.off .face { stroke: var(--bad); stroke-width: 4; stroke-dasharray: 10 7; }
.tile.answer .face { stroke: var(--ok); stroke-width: 4; }
.tile.ghost { opacity: .4; }
.slot { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; stroke-dasharray: 7 6; }
.sheet.pass svg { animation: pass .7s ease; }
.sheet.fail svg { animation: fail .5s ease; }
@keyframes pass { 30% { filter: drop-shadow(0 0 12px rgba(255, 255, 255, .55)); } }
@keyframes fail { 20% { transform: translateX(-5px); } 45% { transform: translateX(5px); } 70% { transform: translateX(-3px); } }

/* ---- countdown timer: one bordered control (minutes, or time left, then Start / Stop) and a small square reset ---- */
/* the timer sits under the rule, at the top left */
.timer { flex: none; align-self: flex-start; display: flex; align-items: stretch; gap: 8px; height: clamp(46px, 5.6vh, 76px); }
.clock { display: flex; align-items: stretch; border: 1.5px solid var(--ink); }
.clock .mins, .clock .time { display: flex; align-items: center; padding: 0 12px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.clock.idle .time, .clock:not(.idle) .mins { display: none; }
/* at rest the minutes read as a time, 25:00: the typed minutes, then a fixed :00 */
.mins { gap: 0; color: var(--ink); }
.mins input, .mins .sfx { font-family: var(--font-mono); font-size: clamp(24px, 3vh, 40px); font-weight: 500; letter-spacing: .01em; }
.mins input { width: 2.1ch; height: 100%; padding: 0; text-align: right; background: none; color: var(--ink); border: none; }
.mins input:focus-visible { outline: none; text-decoration: underline; }
.mins input { -moz-appearance: textfield; appearance: textfield; }
.mins input::-webkit-inner-spin-button, .mins input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

.time { min-width: 4.2em; font-size: clamp(24px, 3vh, 40px); font-weight: 500; letter-spacing: .01em; }
.time.done { color: var(--north); }
/* ▶ ❚❚ ■ as square icon buttons, as tall as the control */
.go { flex: none; display: grid; place-items: center; height: 100%; aspect-ratio: 1 / 1; padding: 0; border-left: 1.5px solid var(--ink); }
.go svg { width: 62%; height: 62%; max-width: 30px; max-height: 30px; fill: currentColor; }
.go:hover, .sq:hover { background: color-mix(in srgb, var(--ink) 10%, transparent); }
.sq { flex: none; aspect-ratio: 1; height: 100%; display: grid; place-items: center; border: 1.5px solid var(--ink); }
#reset-score.sq { height: var(--acc-h); width: var(--acc-h); min-height: 0; align-self: center; }
.sq svg { width: 48%; height: 48%; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---- running accuracy, at the top right ---- */
/* the accuracy words sit level with the reset square: same height, centred on it */
.meter { --acc-h: clamp(56px, 7.5vh, 100px); flex: none; display: flex; align-items: stretch; gap: 16px; }
.score { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 4px; height: var(--acc-h); align-self: center; line-height: 1; }
/* the figure on top, the word under it, the two spanning the reset button's height */
.score .pct { order: -1; }
.score .tally { display: none; }
.score .label { font-family: var(--font-display); font-weight: 600; font-size: calc(var(--acc-h) * .19); letter-spacing: .16em; margin-right: -.16em; text-transform: uppercase; color: var(--ink-soft); }
.pct { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--acc-h) * .76); line-height: .8; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.tally { font-family: var(--font-mono); font-size: clamp(14px, 1.8vh, 24px); color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---- smaller screens keep the same arrangement, sized down so nothing scrolls ---- */
@media (max-width: 1100px), (max-height: 700px) {
  main { gap: 10px; padding: 10px 16px 12px; }
  .name { font-size: 22px; }
  .mid { gap: 18px; }
  .tray { width: 170px; }
  .tray, .chips, .acts { gap: 12px; }
  .term { grid-template-columns: minmax(0, 1fr) 40px; }
  .acts { width: calc(100% - 40px); }
  .act { min-height: 42px; font-size: 17px; }
  .acts .act { min-height: 0; }
  .term .who { font-size: 28px; }
  .lines { gap: 10px; }
  .lines li { padding: 10px 14px; font-size: 22px; }
  .name { font-size: 78px; }
  .timer { height: 40px; }
  .mins input, .mins .sfx, .time { font-size: 20px; }
  .time { min-width: 136px; }
  .meter { --acc-h: 52px; }
}
@media (max-width: 860px), (max-height: 620px) {
  body { height: 100dvh; touch-action: manipulation; }
  .tw { display: none; }
  main { gap: 6px; padding: 6px 12px 8px; }
  .top { gap: 12px; padding-bottom: 5px; border-bottom-width: 1px; }
  .name { font-size: 46px; }
  .verdict { font-size: 14px; }
  .mid { gap: 12px; }
  .tray { width: 150px; }
  .chips { gap: 8px; }
  .term { grid-template-columns: minmax(0, 1fr) 34px; min-height: 44px; }
  .term .who { font-size: 20px; }
  .term .tier { font-size: 11px; }
  .lines { gap: 6px; }
  .lines li { grid-template-columns: minmax(0, 1fr) 15px; gap: 6px; padding: 5px 8px; font-size: 14px; }
  .tray, .chips, .acts { gap: 8px; }
  .acts { width: calc(100% - 34px); }
  .act { min-height: 0; }
  .act { padding: 7px 8px; font-size: 15px; }
  .timer { height: 36px; gap: 6px; }
  .mins input, .mins .sfx { font-size: 16px; }   /* 16px, so a phone does not zoom the page when the box is tapped */
  .clock .mins, .clock .time { padding: 0 8px; }
  .time { min-width: 0; font-size: 16px; }
  .sq svg { width: 18px; height: 18px; }
  .sheet { padding: 0; }
  .meter { gap: 10px; --acc-h: 40px; }
  .score { gap: 2px; min-width: 0; }
}
/* a phone (or any narrow screen): name, timer and accuracy in one row along the top; the board fills the middle with
   ✕ and ✓ stacked at its right; along the bottom, the three statements stacked on the left and the three terms as
   tall columns on the right, the chosen one with ▲ ▼ down its right side. Nothing scrolls. */
@media (max-width: 620px), (max-width: 860px) and (min-height: 621px) {
  main { display: grid; grid-template-columns: minmax(0, 46fr) minmax(0, 54fr); grid-template-rows: auto minmax(0, 1fr) clamp(170px, 31dvh, 300px); gap: 8px; padding: 8px 12px max(10px, env(safe-area-inset-bottom, 0px)); overflow: hidden; }
  .top, .mid, .tray { display: contents; }
  .note { display: none; }
  /* the top row: the name, the timer just past it, and the accuracy (the figure over the word) with its reset at the right */
  .name { grid-area: 1 / 1 / 2 / 3; justify-self: start; align-self: center; font-size: clamp(26px, 10vw, 44px); line-height: 1; letter-spacing: .02em; }
  /* just past the name, however wide it renders (its width is measured into --name-w) */
  .timer { grid-area: 1 / 1 / 2 / 3; justify-self: start; align-self: center; margin-left: calc(var(--name-w, 112px) + 10px); height: 42px; gap: 0; }
  .go { aspect-ratio: auto; width: 38px; }
  .meter { grid-area: 1 / 1 / 2 / 3; justify-self: end; align-self: center; gap: 7px; }
  .score { flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; }
  .score .label { font-size: 10.5px; letter-spacing: .06em; margin-right: 0; }
  .pct { font-size: 29px; line-height: .95; }
  .tally { display: none; }
  #reset-score.sq { height: 42px; width: 42px; min-height: 0; align-self: center; }
  .score { height: auto; }
  #reset-score.sq svg { width: 22px; height: 22px; }
  .mins input, .mins .sfx { font-size: 19px; }   /* the same size as the running time */
  .clock .mins, .clock .time { padding: 0 7px; }
  .time { min-width: 0; font-size: 19px; }
  .desk { grid-area: 2 / 1 / 3 / 3; margin-right: 60px; min-width: 0; min-height: 0; }
  .sheet { padding: 0; }
  .verdict { grid-area: 2 / 1 / 3 / 3; justify-self: start; align-self: start; z-index: 1; pointer-events: none; text-align: left; font-size: 14px; max-width: calc(100% - 64px); }
  .verdict:empty { display: none; }
  .acts { grid-area: 2 / 1 / 3 / 3; justify-self: end; align-self: center; flex-direction: column; width: 52px; gap: 8px; margin: 0; }
  .acts .act { width: 52px; height: 52px; min-height: 0; aspect-ratio: 1; padding: 0; }
  .acts .act svg { width: 26px; height: 26px; }
  .brief { grid-area: 3 / 1 / 4 / 2; min-height: 0; }
  .lines { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); height: 100%; gap: 6px; }
  .lines li { grid-template-columns: minmax(0, 1fr) 15px; gap: 4px; padding: 3px 8px; font-size: 12.5px; line-height: 1.2; align-items: center; overflow: hidden; }
  .lines .t { font-size: 1.45em; line-height: 1; }   /* the term names stand out at a glance */
  .chips { grid-area: 3 / 2 / 4 / 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; height: 100%; min-height: 0; }
  /* on a phone the chosen term has ▲ across its top and ▼ across its bottom, its name between them */
  .term { min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "up" "pick" "down"; }
  .term .nudge { height: 36px; border: 1.5px solid var(--c); }
  .term .nudge[data-push="1"] { border-bottom: none; }
  .term .nudge[data-push="-1"] { border-top: none; }
  .term .who { font-size: 17px; letter-spacing: 0; }
  .term:not(.sel) .pick { grid-row: 1 / -1; }
  .term:not(.sel) .nudge { display: none; }
  .term .nudge { font-size: 12px; }
}
@media (max-width: 380px) {
  .timer { height: 38px; }
  .go { width: 34px; }
  #reset-score.sq { height: 38px; width: 38px; }
  .mins input, .mins .sfx { font-size: 16px; }
  .time { font-size: 16px; }
  .pct { font-size: 26px; }
  .score .label { font-size: 9.5px; }
}
@media (max-width: 350px) {
  .timer { height: 34px; }
  .go { width: 30px; }
  .clock .mins, .clock .time { padding: 0 5px; }
  #reset-score.sq { height: 34px; width: 34px; }
  .mins input, .mins .sfx { font-size: 16px; }   /* 16px at the least, so a phone does not zoom the page when the box is tapped */
  .time { font-size: 16px; }
  .pct { font-size: 22px; }
  .score .label { font-size: 8.5px; letter-spacing: .04em; }
  .lines li { font-size: 11px; padding: 3px 6px; }
  .term .who { font-size: 15px; }
  .term .nudge { height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<main>
  <header class="top">
    <h1 class="name">isoRRT</h1>
    <div class="verdict" id="verdict" role="status"></div>
    <div class="meter">
      <div class="score" role="status"><span class="label">Accuracy</span><span class="pct" id="pct"></span><span class="tally" id="tally"></span></div>
      <button class="sq" id="reset-score" type="button" aria-label="Reset accuracy" title="Reset accuracy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9M4 13a8 8 0 0 0 14.3 4.9"/><path d="M5 2.8v3.8h3.8M19 21.2v-3.8h-3.8"/></svg></button>
    </div>
  </header>

    <div class="timer">
      <!-- one control: the minutes and ▶ (start); once started, the time left with ❚❚ (pause, ▶ again while paused) and ■ (stop) -->
      <div class="clock idle">
        <label class="mins"><input type="number" id="timer-min" min="0.01" max="99" step="any" value="25" inputmode="numeric" aria-label="Minutes"><span class="sfx" aria-hidden="true">:00</span></label>
        <span class="time" id="time" role="timer" aria-label="Time left">25:00</span>
        <button class="go" id="timer-go" type="button" aria-label="Start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
        <!-- once started: Pause (Resume while paused) and Stop, which puts the timer back to its start -->
        <button class="go" id="timer-pause" type="button" hidden aria-label="Pause"></button>
        <button class="go" id="timer-stop" type="button" hidden aria-label="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13"/></svg></button>
      </div>
    </div>


  <section class="mid">
    <div class="tray" aria-label="Terms">
      <div class="chips" id="chips" role="group" aria-label="Terms"></div>
      <div class="acts">

  const squares = {};
  for (const [name, pos] of Object.entries(shown)) {
    const key = pos[0] + ',' + pos[1];
    (squares[key] = squares[key] || []).push({ name, pos });
  }
  const stacks = Object.values(squares).sort((a, b) => py(a[0].pos[0], a[0].pos[1]) - py(b[0].pos[0], b[0].pos[1]));
  for (const stack of stacks) {
    stack.sort((a, b) => b.pos[2] - a.pos[2]);               // highest first
    for (let l = 0; l <= stack[0].pos[2]; l++) {
      const tile = stack.find((s) => s.pos[2] === l);
      if (!tile) { h += slotMarkup([stack[0].pos[0], stack[0].pos[1], l]); continue; }
      let cls = '';
      if (reviewing && game.reveal) cls = 'answer';
      else if (tile.name === game.selected && !reviewing) cls = 'sel';
      if (flagged.has(tile.name)) cls += ' off';
      h += tileMarkup(tile.name, tile.pos, cls);
    }
  }
  /* the compass goes on last so a tile near the edge can never hide it */
  h += '<g id="ghost"></g><g id="compass"></g></g></svg>';
  $('sheet').innerHTML = h;
  drawCompass();
}
/* The compass is one label just off the board: N, NE, E, SE, S, SW, W or NW. While you build it is a
   direction no statement uses; after checking, the other seven appear around the board in a quieter grey. */
function drawCompass() {
  const g = document.getElementById('compass');
  if (!g || !game) return;
  const p = game.puzzle, open = game.phase === 'review';
  const mine = game.shown || 0;
  /* North sits where the bearing says, and each step round the compass is one step round the board */
  const spot = (c) => compassSpot(p.size, p.o + c);
  /* a thin line from the letter back to the point on the board's edge it belongs to */
  const lead = (c, cls) => {
    const a = compassAnchor(p.size, p.o + c), d = compassOffset(p.size, p.o + c), from = 6, to = d - 34;
    return to > from ? '<line class="lead' + (cls ? ' ' + cls : '') + '" x1="' + f1(a.at[0] + a.u[0] * from) + '" y1="' + f1(a.at[1] + a.u[1] * from) + '" x2="' + f1(a.at[0] + a.u[0] * to) + '" y2="' + f1(a.at[1] + a.u[1] * to) + '"/>' : '';
  };
  const cy0 = (p.size - 1) * TH / 2;
  const letter = (cls, at, drop, text) => {
    const len = Math.hypot(at[0], at[1] - cy0) || 1, k = 6 / len;      // 6 units out from the board, and back
    return '<g class="bob" style="--bx:' + f1(at[0] * k) + 'px;--by:' + f1((at[1] - cy0) * k) + 'px"><text' + (cls ? ' class="' + cls + '"' : '') + ' x="' + f1(at[0]) + '" y="' + f1(at[1] + drop) + '" text-anchor="middle"' + upright(at[0], at[1]) + '>' + text + '</text></g>';
  };
  let h = '<g class="given">' + lead(mine) + letter('', spot(mine), 10, shortPoint(mine)) + '</g>';
  if (open) {
    for (let c = 0; c < 8; c++) if (c !== mine) h += lead(c, 'faint') + letter('rose', spot(c), 8, shortPoint(c));
  }
  g.innerHTML = h;
  applyTurn();
}
function drawGhost(x, y) {
  const g = document.getElementById('ghost');
  if (!g) return;
  const tier = game.phase === 'build' && game.selected && x !== null ? landing(game.selected, x, y) : -1;
  g.innerHTML = tier < 0 ? '' : tileMarkup(game.selected, [x, y, tier], 'ghost');
}

/* ---------- panels ---------- */
function statementMarkup(s) {
  return term(s.subject) + ' <span class="rel">' + dirWords(s.dir, s.direct) + '</span> ' + term(s.anchor);
}
function drawBrief() {
  const p = game.puzzle, reviewing = game.phase === 'review';
  $('lines').innerHTML = p.premises.map((s, i) => {
    const cls = reviewing ? (game.marks[i] ? 'ok' : 'off') : '';
    return '<li class="' + cls + '"><span>' + statementMarkup(s) + '</span><span class="mark"' + (reviewing ? ' role="img" aria-label="' + (game.marks[i] ? 'holds' : 'broken') + '">' + (game.marks[i] ? ICONS.check : ICONS.clear) : '>') + '</span></li>';
  }).join('');
  const v = $('verdict');
  v.className = 'verdict';
  v.textContent = '';
  if (reviewing) {
    const bad = game.marks.filter((m) => !m).length;
    v.classList.add(bad ? 'off' : 'ok');
    v.textContent = bad ? bad + ' of ' + game.marks.length + ' statements broken' : 'Every statement holds';
  }
  $('note').textContent = reviewing ? 'All eight compass points are shown now.' + (game.reveal ? ' Shown: one layout that fits. Any spacing that keeps every direction is accepted.' : '') : '';
}
function drawTray() {
  const p = game.puzzle, reviewing = game.phase === 'review';
  /* one button per term: its name in the middle chooses it, the two ends move it down or up a tier */
  $('chips').innerHTML = p.names.map((w) => {
    const fixed = p.fixed.includes(w), q = game.placed[w], chosen = w === game.selected && !reviewing;
    const arrow = (dir, word, glyph) => '<button type="button" class="nudge" data-push="' + dir + '" data-for="' + esc(w) + '"' + (!reviewing && !fixed && nextTier(w, dir) >= 0 ? '' : ' disabled') +
      ' aria-label="' + word + ' ' + esc(w) + ' one tier" title="' + word + ' one tier">' + glyph + '</button>';
    return '<div class="term ' + hueOf(w) + (q ? ' down' : '') + (chosen ? ' sel' : '') + '">' + arrow(-1, 'Lower', '▼') +
      '<button type="button" class="pick" data-term="' + esc(w) + '"' + (fixed || reviewing ? ' disabled' : '') + ' aria-pressed="' + chosen + '">' +
      '<span class="who">' + esc(w) + '</span>' + (q ? '<span class="tier"><span class="tw">tier </span>' + (q[2] + 1) + '</span>' : '') + '</button>' + arrow(1, 'Raise', '▲') + '</div>';
  }).join('');
  const all = p.names.every((w) => game.placed[w]);
  const go = $('act-go');
  /* the two square buttons carry icons: ✕ clear and ✓ check while building; after checking, an eye to show a
     layout that fits (or yours again) and → for the next question */
  go.innerHTML = reviewing ? ICONS.next : ICONS.check;
  go.setAttribute('aria-label', reviewing ? 'Next' : 'Check'); go.title = reviewing ? 'Next' : 'Check';
  go.disabled = !reviewing && !all;
  $('act-clear').hidden = reviewing;
  const ans = $('act-answer');
  ans.hidden = !reviewing;
  ans.innerHTML = game.reveal ? ICONS.mine : ICONS.layout;
  ans.setAttribute('aria-label', game.reveal ? 'Show mine' : 'Show a layout'); ans.title = ans.getAttribute('aria-label');
}
const ICONS = {
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  clear: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>',
  next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  layout: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  mine: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 20L20 4"/></svg>'
};
function drawTally() {
  $('pct').textContent = stats.total ? Math.round(100 * stats.right / stats.total) + '%' : '–';
  $('tally').innerHTML = stats.total ? stats.right + ' / ' + stats.total + '<span class="tw"> correct' + (stats.streak > 1 ? ' · streak ' + stats.streak : '') + '</span>' : 'no answers yet';
}
function drawAll() { drawBoard(); drawBrief(); drawTray(); drawTally(); }

/* ---------- play ---------- */
function occupant(x, y, level) {
  return Object.keys(game.placed).find((w) => { const q = game.placed[w]; return q[0] === x && q[1] === y && q[2] === level; });
}
function firstLoose() {
  return game.puzzle.names.find((w) => !game.placed[w]) || null;
}
/* The tier a term takes when put on a square: a term already on the board keeps its tier if that spot
   is free; otherwise it goes to the lowest free tier, so clicking an occupied square stacks on top. */
function landing(w, x, y) {
  const mine = game.placed[w];
  if (mine && mine[0] === x && mine[1] === y) return -1;
  const free = (l) => { const o = occupant(x, y, l); return !o || o === w; };
  if (mine && free(mine[2])) return mine[2];
  const top = game.puzzle.threeD ? LEVELS : 1;
  for (let l = 0; l < top; l++) if (free(l)) return l;
  return -1;
}
/* the next free tier above (dir 1) or below (dir -1) a placed term, or -1 */
function nextTier(w, dir) {
  const q = game.placed[w];
  if (!q || !game.puzzle.threeD) return -1;
  const l = q[2] + dir;                                      // one tier at a time: a tile already there swaps places with it
  return l >= 0 && l < LEVELS ? l : -1;
}
/* Whenever a term is put on a square, moved to another square, lifted or cleared, the compass letter becomes
   another unnamed point and the board jumps to another of its eight angles. Moving a term up or down a
   tier does neither. The bearing itself stays put, so what you built still stands. */
function reshuffleView() {
  const p = game.puzzle;
  const others = (p.spare || []).filter((c) => c !== game.shown);
  if (others.length) game.shown = pick(others);
  const was = shownAngle();
  game.angle = pick(ANGLES.filter((a) => a !== game.angle));
  swingFrom(was);
}
function selectTerm(w) {
  if (game.phase !== 'build' || game.puzzle.fixed.includes(w)) return;
  game.selected = w;
  drawBoard(); drawTray();
}
function placeAt(x, y) {
  if (game.phase !== 'build') return;
  const w = game.selected;
  const tier = w ? landing(w, x, y) : -1;
  if (tier < 0) return;                                      // no term chosen, or nowhere for it to go on this square
  game.placed[w] = [x, y, tier];
  /* carry on with the next loose term, if any */
  const loose = firstLoose();
  if (loose) game.selected = loose;
  reshuffleView();
  drawBoard(); drawTray();
}
function setTier(w, l) {
  if (game.phase !== 'build' || !game.puzzle.threeD) return;
  const q = w && game.placed[w];
  if (!q || game.puzzle.fixed.includes(w) || l < 0 || l >= LEVELS || q[2] === l) return;
  const other = occupant(q[0], q[1], l);                     // moving into a tier that is taken swaps the two tiles
  if (other) game.placed[other][2] = q[2];
  q[2] = l;
  game.selected = w;
  drawBoard(); drawTray();                                   // a change of tier leaves the board's angle and the compass letter as they are
}
/* the arrows beside a term: up or down one tier, swapping with any tile already there */
function push(w, dir) {
  if (game.phase !== 'build') return;
  const l = nextTier(w, dir);
  if (l >= 0) setTier(w, l);
}
function liftSelected() {
  const w = game.selected;
  if (w && game.placed[w] && game.phase === 'build' && !game.puzzle.fixed.includes(w)) { delete game.placed[w]; reshuffleView(); drawBoard(); drawTray(); }
}
function clearBoard() {
  if (game.phase !== 'build') return;
  for (const w of Object.keys(game.placed)) if (!game.puzzle.fixed.includes(w)) delete game.placed[w];
  game.selected = firstLoose();
  reshuffleView();
  drawBoard(); drawTray();
}
function check() {
  if (game.phase !== 'build' || !game.puzzle.names.every((w) => game.placed[w])) return;
  game.phase = 'review';
  game.marks = judge(game.puzzle, game.placed);
  const right = game.marks.every(Boolean);
  stats.total++;
  if (right) { stats.right++; stats.streak++; stats.best = Math.max(stats.best, stats.streak); } else stats.streak = 0;
  keep.write('iso-trainer.stats', stats);
  drawAll();
  const sheet = $('sheet');
  sheet.classList.remove('pass', 'fail');
  void sheet.offsetWidth;
  sheet.classList.add(right ? 'pass' : 'fail');
  if (right) nextHandle = setTimeout(newQuestion, 1100);     // a correct answer moves on by itself
}
function newQuestion() {
  clearTimeout(nextHandle);
  const puzzle = makePuzzle();
  const was = game ? shownAngle() : null;                    // the very first board simply appears
  game = { puzzle, placed: {}, selected: null, phase: 'build', marks: [], reveal: false, shown: puzzle.given, angle: pick(ANGLES) };
  if (was !== null) swingFrom(was);
  game.selected = firstLoose();
  $('sheet').classList.remove('pass', 'fail');
  drawAll();
}

/* ---------- wiring ---------- */
$('sheet').addEventListener('click', (e) => {
  const cell = e.target.closest('[data-x]');
  if (cell) placeAt(+cell.getAttribute('data-x'), +cell.getAttribute('data-y'));
});
$('sheet').addEventListener('pointermove', (e) => {
  const cell = e.target.closest ? e.target.closest('[data-x]') : null;
  if (cell) drawGhost(+cell.getAttribute('data-x'), +cell.getAttribute('data-y')); else drawGhost(null, null);
});
$('sheet').addEventListener('pointerleave', () => drawGhost(null, null));
$('chips').addEventListener('click', (e) => {
  const arrow = e.target.closest('[data-push]');
  if (arrow) {
    const w = arrow.getAttribute('data-for'), dir = arrow.getAttribute('data-push');
    push(w, +dir);
    /* the row was redrawn: put the keyboard focus back on the same arrow */
    const again = [...$('chips').querySelectorAll('[data-push]')].find((b) => b.getAttribute('data-for') === w && b.getAttribute('data-push') === dir);
    if (again && !again.disabled) again.focus();
    return;
  }
  const b = e.target.closest('[data-term]');
  if (b) selectTerm(b.getAttribute('data-term'));
});
$('act-clear').addEventListener('click', clearBoard);
$('act-go').addEventListener('click', () => { if (game.phase === 'review') newQuestion(); else check(); });
$('act-answer').addEventListener('click', () => { game.reveal = !game.reveal; drawAll(); });

document.addEventListener('keydown', (e) => {
  if ((e.target.tagName || '').toLowerCase() === 'input') return;          // typing a minute value
  if (e.key === 'Enter') { e.preventDefault(); $('act-go').click(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') liftSelected();
  else if (!game.puzzle.threeD || !game.selected) return;
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); push(game.selected, e.key === 'ArrowUp' ? 1 : -1); }
  else if (+e.key >= 1 && +e.key <= LEVELS) setTier(game.selected, +e.key - 1);
});

$('reset-score').addEventListener('click', () => { stats = { right: 0, total: 0, streak: 0, best: 0 }; keep.write('iso-trainer.stats', stats); drawTally(); });

/* ---------- countdown timer: a plain stopwatch running backwards, it never touches the questions ---------- */
const timer = { left: 0, endAt: 0, running: false, done: false, frame: 0 };
const TIMER_ICONS = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="5" width="4.5" height="14"/><rect x="14" y="5" width="4.5" height="14"/></svg>'
};
function minutesTyped() {
  const v = parseFloat($('timer-min').value);
  return isFinite(v) && v > 0 ? Math.min(v, 999) : 0;
}
function timeText(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000 - 1e-6));          // whole seconds, rounded up, so it reads 00:00 only at the end
  const two = (n) => String(n).padStart(2, '0');
  return two(Math.floor(t / 60)) + ':' + two(t % 60);
}
function drawTimer() {
  $('time').textContent = timeText(timer.left);
  $('time').classList.toggle('done', timer.done);
  /* at rest the control shows the minutes and Start; once started it shows the time left, Pause (Resume while
     paused) and Stop; when the time has run out only Stop is left, to put it back to the start */
  const idle = !timer.running && !timer.done && !timer.touched;
  document.querySelector('.clock').classList.toggle('idle', idle);
  $('timer-go').hidden = !idle;
  $('timer-pause').hidden = idle || timer.done;
  /* drawn as icons, not glyphs, so a phone never swaps them for emoji */
  $('timer-pause').innerHTML = timer.running ? TIMER_ICONS.pause : TIMER_ICONS.play;
  $('timer-pause').setAttribute('aria-label', timer.running ? 'Pause' : 'Resume');
  $('timer-stop').hidden = idle;
}
function tickTimer() {
  timer.left = timer.endAt - performance.now();               // read off the clock each frame, so it cannot drift
  if (timer.left <= 0) { timer.left = 0; timer.running = false; timer.done = true; drawTimer(); return; }
  drawTimer();
  timer.frame = requestAnimationFrame(tickTimer);
}
function startTimer() {
  if (timer.running) return;
  if (timer.left <= 0) timer.left = minutesTyped() * 60000;   // ran out earlier: go again from the typed value
  if (timer.left <= 0) return;
  timer.running = true;
  timer.touched = true;
  timer.done = false;
  timer.endAt = performance.now() + timer.left;
  tickTimer();
}
function stopTimer() {                                        // a pause: Start carries on from here
  if (!timer.running) return;
  cancelAnimationFrame(timer.frame);
  timer.left = Math.max(0, timer.endAt - performance.now());
  timer.running = false;
  drawTimer();
}
function resetTimer() {
  cancelAnimationFrame(timer.frame);
  timer.running = false;
  timer.done = false;
  timer.touched = false;
  timer.left = minutesTyped() * 60000;
  drawTimer();
}
$('timer-go').addEventListener('click', startTimer);
$('timer-pause').addEventListener('click', () => { if (timer.running) stopTimer(); else startTimer(); });
$('timer-stop').addEventListener('click', resetTimer);
$('timer-min').addEventListener('input', () => {
  if (minutesTyped() > 0) keep.write('iso-trainer.timer', { minutes: $('timer-min').value });
  if (!timer.running && !timer.touched) resetTimer();         // a new value shows at once while the timer is at rest
});
/* tapping or clicking the minutes empties the box, ready for a new value; leaving it empty puts the old one back */
let minutesBefore = '';
$('timer-min').addEventListener('focus', (e) => { minutesBefore = e.target.value; e.target.value = ''; });
$('timer-min').addEventListener('blur', (e) => {
  if (minutesTyped() > 0) return;
  e.target.value = minutesBefore || '25';
  if (!timer.running && !timer.touched) resetTimer();
});
$('timer-min').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); startTimer(); } });

/* the phone top row puts the timer just past the name, so it needs the name's rendered width */
{
  const nameEl = document.querySelector('.name');
  const setNameW = () => document.documentElement.style.setProperty('--name-w', nameEl.offsetWidth + 'px');
  setNameW();
  if (window.ResizeObserver) new ResizeObserver(setNameW).observe(nameEl);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(setNameW);
}

/* ---------- start (keeps a question in progress across a page update) ---------- */
function start(saved) {
  const kept = keep.read('iso-trainer.timer');
  if (kept && parseFloat(kept.minutes) > 0) $('timer-min').value = kept.minutes;
  resetTimer();
  stats = Object.assign(stats, keep.read('iso-trainer.stats') || {}, saved && saved.stats || {});
  const old = saved && saved.game;
  /* a question left over from an earlier version of the page may not fit this one: start a fresh one instead */
  if (old && old.puzzle && Array.isArray(old.puzzle.spare) && typeof old.angle === 'number' && old.puzzle.v === 7) {
    game = old;
    drawAll();
  } else {
    newQuestion();
  }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ stats, game }));
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
